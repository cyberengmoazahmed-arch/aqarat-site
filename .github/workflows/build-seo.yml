name: Build SEO pages

on:
  push:
    branches: [main]
    paths:
      - 'data/listings.js'
      - 'tools/build-seo.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-seo
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate listing pages + sitemap
        run: node tools/build-seo.js
      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add unit sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: تحديث صفحات SEO + sitemap"
            git push
          fi
